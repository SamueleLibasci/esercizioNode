<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/api/v1/css/signup.css">
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
</head>

<body>

    <!-- Contenitore Navbar: popolato dinamicamente da navbar.js (carica navbar.html e gestisce lo stato di autenticazione) -->
    <div id="navbar"></div>
    <script src="/api/v1/js/navbar.js"></script>

    <!-- Modulo di registrazione utente (POST verso il Gateway) -->
    <div class="signup-wrapper">
        <div class="signup-box">
            <h2>Sign Up</h2>
            <form action="/api/v1/signup" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Registrati</button>
            </form>
        </div>
    </div>

    <!-- Contenitore Footer condiviso -->
    <div id="footer">
        <script>
            fetch('/api/v1/components/footer.html')
                .then(response => response.text())
                .then(html => document.getElementById('footer').innerHTML = html);
        </script>
    </div>

</body>

</html>
